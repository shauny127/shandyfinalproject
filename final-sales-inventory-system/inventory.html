<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Management System</title>
  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100%;
            overflow-x: hidden;
        }

        html, body {
            height: 100%;
        }

        /* Container */
        .app-container {
            display: flex;
            height: 100%;
            position: relative;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
            padding: 0;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 100;
        }

        .sidebar-header {
            padding: 30px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom: 3px solid rgba(255, 255, 255, 0.2);
        }

        .sidebar-header h1 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .sidebar-header p {
            font-size: 13px;
            opacity: 0.95;
            font-weight: 500;
        }

        .sidebar-nav {
            flex: 1;
            padding: 20px 0;
            overflow-y: auto;
        }

        .nav-section {
            margin-bottom: 25px;
        }

        .nav-section-title {
            padding: 10px 25px;
            font-size: 11px;
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-item {
            padding: 14px 25px;
            color: #333;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            border-left: 4px solid transparent;
        }

        .nav-item:hover {
            background: rgba(102, 126, 234, 0.08);
            border-left-color: #667eea;
        }

        .nav-item.active {
            background: rgba(102, 126, 234, 0.12);
            color: #667eea;
            border-left-color: #667eea;
        }

        .nav-icon {
            font-size: 20px;
            width: 24px;
            text-align: center;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.05);
        }

        .page-header {
            background: rgba(255, 255, 255, 0.98);
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .page-header h2 {
            font-size: 32px;
            color: #1e3c72;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .page-header p {
            color: #666;
            font-size: 15px;
        }

        /* Dashboard Cards */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.98);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border-left: 5px solid;
        }

        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .metric-card.blue { border-left-color: #4A90E2; }
        .metric-card.green { border-left-color: #7ED321; }
        .metric-card.orange { border-left-color: #F5A623; }
        .metric-card.purple { border-left-color: #9013FE; }
        .metric-card.red { border-left-color: #D0021B; }
        .metric-card.teal { border-left-color: #50E3C2; }

        .metric-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .metric-title {
            font-size: 14px;
            color: #999;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-icon {
            font-size: 32px;
            opacity: 0.8;
        }

        .metric-value {
            font-size: 42px;
            font-weight: 800;
            color: #1e3c72;
            line-height: 1;
            margin-bottom: 5px;
        }

        .metric-label {
            font-size: 13px;
            color: #666;
            font-weight: 500;
        }

        /* Content Card */
        .content-card {
            background: rgba(255, 255, 255, 0.98);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: #1e3c72;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        /* Forms */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group input[readonly] {
            background: #f5f5f5;
            cursor: not-allowed;
        }

        /* Buttons */
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .btn-success {
            background: #7ED321;
            color: white;
            box-shadow: 0 6px 20px rgba(126, 211, 33, 0.4);
        }

        .btn-success:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(126, 211, 33, 0.5);
        }

        .btn-danger {
            background: #D0021B;
            color: white;
            box-shadow: 0 6px 20px rgba(208, 2, 27, 0.4);
        }

        .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(208, 2, 27, 0.5);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
            margin-left: 10px;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #d0d0d0;
        }

        /* Tables */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        table th {
            padding: 16px 20px;
            text-align: left;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        table td {
            padding: 14px 20px;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
            font-size: 14px;
        }

        table tbody tr {
            transition: background 0.2s ease;
        }

        table tbody tr:hover {
            background: rgba(102, 126, 234, 0.05);
        }

        .table-actions {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
        }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-success {
            background: #d4edda;
            color: #155724;
        }

        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }

        .badge-danger {
            background: #f8d7da;
            color: #721c24;
        }

        .badge-info {
            background: #d1ecf1;
            color: #0c5460;
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: white;
            padding: 20px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 15px;
            animation: slideIn 0.3s ease;
            max-width: 400px;
            border-left: 4px solid;
        }

        @keyframes slideIn {
            from {
                transform: translateX(500px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast.success { border-left-color: #7ED321; }
        .toast.error { border-left-color: #D0021B; }
        .toast.warning { border-left-color: #F5A623; }
        .toast.info { border-left-color: #4A90E2; }

        .toast-content h4 {
            font-size: 14px;
            font-weight: 700;
            color: #333;
            margin-bottom: 4px;
        }

        .toast-content p {
            font-size: 13px;
            color: #666;
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 22px;
            color: #666;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .empty-state p {
            font-size: 15px;
            margin-bottom: 20px;
        }

        /* Alert Box */
        .alert {
            padding: 16px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }

        .alert-warning {
            background: #fff3cd;
            border-left: 4px solid #F5A623;
            color: #856404;
        }

        .alert-info {
            background: #d1ecf1;
            border-left: 4px solid #4A90E2;
            color: #0c5460;
        }

        .alert-danger {
            background: #f8d7da;
            border-left: 4px solid #D0021B;
            color: #721c24;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: white;
            padding: 35px;
            border-radius: 16px;
            max-width: 600px;
            width: 90%;
            max-height: 90%;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: scaleIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-header {
            margin-bottom: 25px;
        }

        .modal-header h3 {
            font-size: 24px;
            color: #1e3c72;
            font-weight: 800;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 25px;
        }

        /* Filter Bar */
        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-bar select,
        .filter-bar input {
            padding: 10px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        /* Charts placeholder */
        .chart-container {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 30px;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar {
                width: 240px;
            }
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
            }

            .main-content {
                padding: 20px;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .btn-secondary {
                margin-left: 0;
                margin-top: 10px;
            }
        }

        /* Low Stock Highlight */
        .low-stock-row {
            background: rgba(245, 166, 35, 0.1) !important;
        }

        .low-stock-row:hover {
            background: rgba(245, 166, 35, 0.15) !important;
        }

        /* Loading State */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9998;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s linear infinite;
        }
    </style>
 </head>
 <body>
  <div class="app-container">
   <aside class="sidebar">
    <div class="sidebar-header">
     <h1 id="company-name">Inventory Manager Pro</h1>
     <p id="system-tagline">Complete Inventory Management Solution</p>
    </div>
    <nav class="sidebar-nav">
     <div class="nav-section">
      <div class="nav-section-title">
       Main
      </div>
      <div class="nav-item active" onclick="navigateTo('dashboard')" data-page="dashboard"><span class="nav-icon">📊</span> <span>Dashboard</span>
      </div>
     </div>
     <div class="nav-section">
      <div class="nav-section-title">
       Inventory
      </div>
      <div class="nav-item" onclick="navigateTo('products')" data-page="products"><span class="nav-icon">📦</span> <span>Products</span>
      </div>
      <div class="nav-item" onclick="navigateTo('low-stock')" data-page="low-stock"><span class="nav-icon">⚠️</span> <span>Low Stock Alerts</span>
      </div>
      <div class="nav-item" onclick="navigateTo('categories')" data-page="categories"><span class="nav-icon">🏷️</span> <span>Categories</span>
      </div>
     </div>
     <div class="nav-section">
      <div class="nav-section-title">
       Transactions
      </div>
      <div class="nav-item" onclick="navigateTo('sales')" data-page="sales"><span class="nav-icon">💰</span> <span>Sales</span>
      </div>
      <div class="nav-item" onclick="navigateTo('reports')" data-page="reports"><span class="nav-icon">📈</span> <span>Sales Reports</span>
      </div>
     </div>
     <div class="nav-section">
      <div class="nav-section-title">
       Management
      </div>
      <div class="nav-item" onclick="navigateTo('suppliers')" data-page="suppliers"><span class="nav-icon">🚚</span> <span>Suppliers</span>
      </div>
      <div class="nav-item" onclick="navigateTo('customers')" data-page="customers"><span class="nav-icon">👥</span> <span>Customers</span>
      </div>
      <div class="nav-item" onclick="navigateTo('employees')" data-page="employees"><span class="nav-icon">👤</span> <span>Employees</span>
      </div>
     </div>
    </nav>
   </aside>
   <main class="main-content" id="main-content">
    <!-- Content will be dynamically loaded here -->
   </main>
  </div>

  <script>
// API Configuration
const API_BASE = 'http://localhost/inventory-system/api';

// Global State
let allRecords = [];
let currentPage = 'dashboard';
let editingRecord = null;

// API Functions
const api = {
    async getRecords(type) {
        try {
            const response = await fetch(`${API_BASE}/${type}.php`);
            if (!response.ok) throw new Error('Network response was not ok');
            return await response.json();
        } catch (error) {
            console.error('API Error:', error);
            showToast('Error', `Failed to load ${type}`, 'error');
            return [];
        }
    },

    async createRecord(type, data) {
        try {
            const response = await fetch(`${API_BASE}/${type}.php`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            return { isOk: response.ok, message: result.message };
        } catch (error) {
            console.error('API Error:', error);
            return { isOk: false, message: 'Network error' };
        }
    },

    async updateRecord(type, data) {
        try {
            const response = await fetch(`${API_BASE}/${type}.php`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            return { isOk: response.ok, message: result.message };
        } catch (error) {
            console.error('API Error:', error);
            return { isOk: false, message: 'Network error' };
        }
    },

    async deleteRecord(type, data) {
        try {
            const response = await fetch(`${API_BASE}/${type}.php`, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            return { isOk: response.ok, message: result.message };
        } catch (error) {
            console.error('API Error:', error);
            return { isOk: false, message: 'Network error' };
        }
    }
};

// Initialize with real data
async function initDataSDK() {
    try {
        showLoading(true);
        
        // Load all data types from the API
        const [products, categories, suppliers, customers, employees, sales] = await Promise.all([
            api.getRecords('products'),
            api.getRecords('categories'),
            api.getRecords('suppliers'),
            api.getRecords('customers'),
            api.getRecords('employees'),
            api.getRecords('sales')
        ]);
        
        // Combine all records
        allRecords = [
            ...products,
            ...categories,
            ...suppliers,
            ...customers,
            ...employees,
            ...sales
        ];
        
        showLoading(false);
        refreshCurrentPage();
        
    } catch (error) {
        console.error('Failed to load data:', error);
        showLoading(false);
        showToast('Error', 'Failed to load data from server', 'error');
    }
}

// Loading overlay function
function showLoading(show) {
    let overlay = document.getElementById('loading-overlay');
    if (show) {
        if (!overlay) {
            overlay = document.createElement('div');
            overlay.id = 'loading-overlay';
            overlay.className = 'loading-overlay';
            overlay.innerHTML = '<div class="loading-spinner"></div>';
            document.body.appendChild(overlay);
        }
        overlay.style.display = 'flex';
    } else {
        if (overlay) {
            overlay.style.display = 'none';
        }
    }
}

// Utility Functions
function showToast(title, message, type = 'info') {
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `
        <div style="font-size: 28px;">${type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️'}</div>
        <div class="toast-content">
            <h4>${title}</h4>
            <p>${message}</p>
        </div>
    `;
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.style.animation = 'slideIn 0.3s ease reverse';
        setTimeout(() => toast.remove(), 300);
    }, 3500);
}

function generateId(prefix) {
    return `${prefix}_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
}

function formatCurrency(amount) {
    return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD'
    }).format(amount);
}

function formatDate(dateString) {
    return new Date(dateString).toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
    });
}

// Navigation
function navigateTo(page) {
    currentPage = page;
    
    document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('active');
    });
    
    const activeNav = document.querySelector(`[data-page="${page}"]`);
    if (activeNav) {
        activeNav.classList.add('active');
    }

    refreshCurrentPage();
}

function refreshCurrentPage() {
    const pages = {
        'dashboard': renderDashboard,
        'products': renderProducts,
        'low-stock': renderLowStock,
        'categories': renderCategories,
        'sales': renderSales,
        'reports': renderReports,
        'suppliers': renderSuppliers,
        'customers': renderCustomers,
        'employees': renderEmployees
    };

    const renderFunction = pages[currentPage];
    if (renderFunction) {
        renderFunction();
    }
}

// Get Records by Type
function getRecordsByType(type) {
    return allRecords.filter(r => r.record_type === type);
}

async function handleAddProduct(event) {

    const btn = document.getElementById('add-product-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Adding...';

    const product = {
        product_id: generateId('prod'),
        product_name: document.getElementById('product-name').value,
        product_description: document.getElementById('product-description').value,
        category_id: document.getElementById('product-category').value,
        unit_price: parseFloat(document.getElementById('product-price').value),

        reorder_level: parseInt(document.getElementById('product-reorder').value),
        supplier_id: document.getElementById('product-supplier').value
    };

    const result = await api.createRecord('products', product);

    btn.disabled = false;
    btn.innerHTML = '<span>Add Product</span>';

// Sales Management
function renderSales() {
    const sales = getRecordsByType('sale');
    const products = getRecordsByType('product');
    const customers = getRecordsByType('customer');
    const employees = getRecordsByType('employee');

    document.getElementById('main-content').innerHTML = `
        <div class="page-header">
            <h2>💰 Sales Management</h2>
            <p>Record and track all sales transactions</p>
        </div>

        <div class="content-card">
            <div class="card-title">Record New Sale</div>
            <form onsubmit="handleAddSale(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="sale-product">Product *</label>
                        <select id="sale-product" required onchange="updateSalePrice()">
                            <option value="">-- Select Product --</option>
                            ${products.filter(p => p.quantity_in_stock > 0).map(p => 
                                `<option value="${p.product_id}" data-price="${p.unit_price}" data-stock="${p.quantity_in_stock}">
                                    ${p.product_name} (Stock: ${p.quantity_in_stock})
                                </option>`
                            ).join('')}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="sale-quantity">Quantity *</label>
                        <input type="number" id="sale-quantity" min="1" value="1" required onchange="updateSaleTotal()">
                    </div>
                    <div class="form-group">
                        <label for="sale-price">Unit Price ($)</label>
                        <input type="number" id="sale-price" step="0.01" readonly>
                    </div>
                    <div class="form-group">
                        <label for="sale-total">Total Amount ($)</label>
                        <input type="number" id="sale-total" step="0.01" readonly>
                    </div>
                    <div class="form-group">
                        <label for="sale-customer">Customer (Optional)</label>
                        <select id="sale-customer">
                            <option value="">-- Walk-in Customer --</option>
                            ${customers.map(c => `<option value="${c.customer_id}">${c.customer_name}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="sale-employee">Employee (Optional)</label>
                        <select id="sale-employee">
                            <option value="">-- Select Employee --</option>
                            ${employees.map(e => `<option value="${e.employee_id}">${e.employee_name}</option>`).join('')}
                        </select>
                    </div>
                </div>
                ${products.filter(p => p.quantity_in_stock > 0).length === 0 ? `
                    <div class="alert alert-warning">
                        <span style="font-size: 24px;">⚠️</span>
                        <div>No products with available stock. Please add inventory before recording sales.</div>
                    </div>
                ` : ''}
                <button type="submit" class="btn btn-success" id="add-sale-btn" ${products.filter(p => p.quantity_in_stock > 0).length === 0 ? 'disabled' : ''}>
                    <span>Record Sale</span>
                </button>
            </form>
        </div>

        <div class="content-card">
            <div class="card-title">Sales History (${sales.length})</div>
            ${sales.length > 0 ? `
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Product</th>
                                <th>Quantity</th>
                                <th>Unit Price</th>
                                <th>Total Amount</th>
                                <th>Customer</th>
                                <th>Employee</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${sales.sort((a, b) => new Date(b.sale_date || b.created_at) - new Date(a.sale_date || a.created_at)).map(s => `
                                <tr>
                                    <td>${formatDate(s.sale_date || s.created_at)}</td>
                                    <td><strong>${s.sale_product_name}</strong></td>
                                    <td>${s.sale_quantity}</td>
                                    <td>${formatCurrency(s.sale_unit_price)}</td>
                                    <td><strong>${formatCurrency(s.sale_total_amount)}</strong></td>
                                    <td>${s.sale_customer_name || 'Walk-in'}</td>
                                    <td>${s.sale_employee_name || 'N/A'}</td>
                                    <td class="table-actions">
                                        <button class="btn btn-sm btn-danger" onclick='deleteSale(${JSON.stringify(s).replace(/'/g, "\\'")})'>Delete</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            ` : `
                <div class="empty-state">
                    <div class="empty-icon">💰</div>
                    <h3>No Sales Yet</h3>
                    <p>Record your first sale using the form above</p>
                </div>
            `}
        </div>
    `;
}

function updateSalePrice() {
    const select = document.getElementById('sale-product');
    const option = select.options[select.selectedIndex];
    
    if (option.value) {
        const price = parseFloat(option.getAttribute('data-price'));
        document.getElementById('sale-price').value = price.toFixed(2);
        updateSaleTotal();
    } else {
        document.getElementById('sale-price').value = '';
        document.getElementById('sale-total').value = '';
    }
}

function updateSaleTotal() {
    const price = parseFloat(document.getElementById('sale-price').value) || 0;
    const quantity = parseInt(document.getElementById('sale-quantity').value) || 0;
    const total = price * quantity;
    document.getElementById('sale-total').value = total.toFixed(2);
}

async function handleAddSale(event) {
    event.preventDefault();

    const productId = document.getElementById('sale-product').value;
    const quantity = parseInt(document.getElementById('sale-quantity').value);
    const customerId = document.getElementById('sale-customer').value;
    const employeeId = document.getElementById('sale-employee').value;

    // Find product and validate stock
    const product = allRecords.find(r => r.record_type === 'product' && r.product_id === productId);
    
    if (!product) {
        showToast('Error', 'Product not found', 'error');
        return;
    }

    if (product.quantity_in_stock < quantity) {
        showToast('Error', `Insufficient stock. Only ${product.quantity_in_stock} units available`, 'error');
        return;
    }

    const btn = document.getElementById('add-sale-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Recording...';

    // Create sale record
    const sale = {
        sale_id: generateId('sale'),
        sale_product_id: productId,
        sale_quantity: quantity,
        sale_unit_price: product.unit_price,
        sale_total_amount: product.unit_price * quantity,
        sale_customer_id: customerId || null,
        sale_employee_id: employeeId || null
    };

    const result = await api.createRecord('sales', sale);

    btn.disabled = false;
    btn.innerHTML = '<span>Record Sale</span>';

    if (result.isOk) {
        showToast('Success!', `Sale recorded! Inventory updated: ${product.product_name}`, 'success');
        event.target.reset();
        document.getElementById('sale-price').value = '';
        document.getElementById('sale-total').value = '';
        await initDataSDK();
    } else {
        showToast('Error', result.message || 'Failed to record sale', 'error');
    }
}

function deleteSale(sale) {
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.innerHTML = `
        <div class="modal">
            <div class="modal-header">
                <h3>⚠️ Confirm Deletion</h3>
            </div>
            <p>Delete sale for <strong>${sale.sale_product_name}</strong>?</p>
            <p style="color: #F5A623;"><strong>Note:</strong> This will restore the inventory automatically.</p>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
                <button type="button" class="btn btn-danger" onclick="executeDeleteSale('${sale.sale_id}', '${sale.sale_product_name}')">Delete</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
}

async function executeDeleteSale(identifier, productName) {
    const result = await api.deleteRecord('sales', { sale_id: identifier });

    if (result.isOk) {
        showToast('Deleted', 'Sale deleted successfully', 'success');
        document.querySelector('.modal-overlay').remove();
        await initDataSDK();
    } else {
        showToast('Error', result.message || 'Failed to delete sale', 'error');
    }
}

// Sales Reports
function renderReports() {
    const sales = getRecordsByType('sale');
    
    // Calculate metrics
    const totalRevenue = sales.reduce((sum, s) => sum + (s.sale_total_amount || 0), 0);
    const totalSales = sales.length;
    const averageSale = totalSales > 0 ? totalRevenue / totalSales : 0;

    // Group by product
    const salesByProduct = {};
    sales.forEach(sale => {
        if (!salesByProduct[sale.sale_product_id]) {
            salesByProduct[sale.sale_product_id] = {
                name: sale.sale_product_name,
                quantity: 0,
                revenue: 0,
                count: 0
            };
        }
        salesByProduct[sale.sale_product_id].quantity += sale.sale_quantity;
        salesByProduct[sale.sale_product_id].revenue += sale.sale_total_amount;
        salesByProduct[sale.sale_product_id].count++;
    });

    const productStats = Object.values(salesByProduct).sort((a, b) => b.revenue - a.revenue);

    // Recent 30 days
    const thirtyDaysAgo = new Date();
    thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
    const recentSales = sales.filter(s => new Date(s.sale_date || s.created_at) >= thirtyDaysAgo);
    const recentRevenue = recentSales.reduce((sum, s) => sum + s.sale_total_amount, 0);

    document.getElementById('main-content').innerHTML = `
        <div class="page-header">
            <h2>📈 Sales Reports & Analytics</h2>
            <p>Comprehensive sales performance analysis</p>
        </div>

        <div class="dashboard-grid">
            <div class="metric-card green">
                <div class="metric-header">
                    <div class="metric-title">Total Revenue</div>
                    <div class="metric-icon">💰</div>
                </div>
                <div class="metric-value">${formatCurrency(totalRevenue)}</div>
                <div class="metric-label">All-time sales</div>
            </div>

            <div class="metric-card blue">
                <div class="metric-header">
                    <div class="metric-title">Total Sales</div>
                    <div class="metric-icon">📊</div>
                </div>
                <div class="metric-value">${totalSales}</div>
                <div class="metric-label">Transactions completed</div>
            </div>

            <div class="metric-card purple">
                <div class="metric-header">
                    <div class="metric-title">Average Sale</div>
                    <div class="metric-icon">📈</div>
                </div>
                <div class="metric-value">${formatCurrency(averageSale)}</div>
                <div class="metric-label">Per transaction</div>
            </div>

            <div class="metric-card orange">
                <div class="metric-header">
                    <div class="metric-title">Last 30 Days</div>
                    <div class="metric-icon">📅</div>
                </div>
                <div class="metric-value">${formatCurrency(recentRevenue)}</div>
                <div class="metric-label">${recentSales.length} sales</div>
            </div>
        </div>

        ${productStats.length > 0 ? `
            <div class="content-card">
                <div class="card-title">Top Selling Products</div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Product</th>
                                <th>Units Sold</th>
                                <th>Total Revenue</th>
                                <th>Number of Sales</th>
                                <th>Avg per Sale</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${productStats.map((stat, index) => `
                                <tr>
                                    <td><strong>#${index + 1}</strong></td>
                                    <td><strong>${stat.name}</strong></td>
                                    <td>${stat.quantity}</td>
                                    <td><strong>${formatCurrency(stat.revenue)}</strong></td>
                                    <td>${stat.count}</td>
                                    <td>${formatCurrency(stat.revenue / stat.count)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="content-card">
                <div class="card-title">Recent Sales Activity</div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Product</th>
                                <th>Quantity</th>
                                <th>Amount</th>
                                <th>Customer</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${sales.sort((a, b) => new Date(b.sale_date || b.created_at) - new Date(a.sale_date || a.created_at)).slice(0, 10).map(s => `
                                <tr>
                                    <td>${formatDate(s.sale_date || s.created_at)}</td>
                                    <td>${s.sale_product_name}</td>
                                    <td>${s.sale_quantity}</td>
                                    <td><strong>${formatCurrency(s.sale_total_amount)}</strong></td>
                                    <td>${s.sale_customer_name || 'Walk-in'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        ` : `
            <div class="content-card">
                <div class="empty-state">
                    <div class="empty-icon">📈</div>
                    <h3>No Sales Data</h3>
                    <p>Start recording sales to see analytics here</p>
                </div>
            </div>
        `}

}

                                    <td>${e.employee_email}</td>
                                    <td>${e.employee_phone}</td>
                                    <td class="table-actions">
                                        <button class="btn btn-sm btn-danger" onclick='deleteEmployee(${JSON.stringify(e).replace(/'/g, "\\'")})'>Delete</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            ` : `
                <div class="empty-state">
                    <div class="empty-icon">👤</div>
                    <h3>No Employees Yet</h3>
                    <p>Add your first employee using the form above</p>
                </div>
            `}
        </div>
    `;
}

async function handleAddEmployee(event) {
    event.preventDefault();

    const btn = document.getElementById('add-employee-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Adding...';

    const employee = {
        employee_id: generateId('emp'),
        employee_name: document.getElementById('employee-name').value,
        employee_position: document.getElementById('employee-position').value,
        employee_email: document.getElementById('employee-email').value,
        employee_phone: document.getElementById('employee-phone').value
    };

    const result = await api.createRecord('employees', employee);

    btn.disabled = false;
    btn.innerHTML = '<span>Add Employee</span>';

    if (result.isOk) {
        showToast('Success!', 'Employee added successfully', 'success');
        event.target.reset();
        await initDataSDK();
    } else {
        showToast('Error', result.message || 'Failed to add employee', 'error');
    }
}

function deleteEmployee(employee) {
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.innerHTML = `
        <div class="modal">
            <div class="modal-header">
                <h3>⚠️ Confirm Deletion</h3>
            </div>
            <p>Delete employee <strong>${employee.employee_name}</strong>?</p>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
                <button type="button" class="btn btn-danger" onclick="executeDeleteEmployee('${employee.employee_id}', '${employee.employee_name}')">Delete</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
}

async function executeDeleteEmployee(identifier, employeeName) {
    const result = await api.deleteRecord('employees', { employee_id: identifier });

    if (result.isOk) {
        showToast('Deleted', 'Employee deleted successfully', 'success');
        document.querySelector('.modal-overlay').remove();
        await initDataSDK();
    } else {
        showToast('Error', result.message || 'Failed to delete employee', 'error');
    }
}

// Initialize app
initDataSDK();
